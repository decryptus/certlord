name: Textual terminal tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  textual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.yml
      - run: python -m pip install '.[textual]' resvg-py
      - run: python .github/scripts/check-test-collection.py --runner unittest textual_tests
      - run: python -m unittest discover -s textual_tests -v
      - run: python scripts/capture_textual.py --output /tmp/textual-captures --png
      - uses: actions/upload-artifact@v7
        with:
          name: textual-captures
          path: /tmp/textual-captures
