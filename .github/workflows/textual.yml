name: Textual terminal tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  textual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.yml
      - run: python -m pip install '.[textual]' resvg-py
      - run: python .github/scripts/check-test-collection.py --runner unittest textual_tests
      - run: python -m unittest discover -s textual_tests -v
      - run: python scripts/capture_textual.py --output /tmp/textual-captures --png
      - uses: actions/upload-artifact@v4
        with:
          name: textual-captures
          path: /tmp/textual-captures
