name: Tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
        dependencies: ['minimum', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "minimum" ]; then
            python -m pip install -r requirements.txt -c constraints-minimum.txt build
          else
            python -m pip install -r requirements.txt build
          fi
          python -m pip check
      - name: Verify collection and its failure guards
        run: |
          python .github/scripts/check-test-collection.py --runner unittest tests tests/contracts
          python .github/scripts/check-test-collection.py --runner unittest .github/tests
          python -m unittest discover -s .github/tests -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Component contracts
        run: python -m unittest discover -s tests/contracts -v
      - name: Build source archive and wheel
        run: python -m build
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
      - name: Installed CLI smoke test
        working-directory: /tmp
        run: certlord --help


      - name: Installed-package regression suites outside checkout
        working-directory: /tmp
        run: |
          suite_dir=$(mktemp -d)
          cp -R "$GITHUB_WORKSPACE/tests" "$GITHUB_WORKSPACE/etc" "$suite_dir/"
          cd "$suite_dir"
          python "$GITHUB_WORKSPACE/.github/scripts/check-test-collection.py" --runner unittest tests tests/contracts
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/contracts -v
