name: Docker image and Compose
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish validated image to Docker Hub
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CERTLORD_IMAGE: certlord-compose-test:local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build certlord
      - name: Start installed stack and verify restart persistence
        run: sh docker/smoke.sh
      - name: Installed image dependency check
        run: docker compose exec -T certlord python -m pip check
      - name: Sanitized service state
        if: always()
        run: docker compose ps -a
      - name: Remove disposable stack
        if: always()
        run: docker compose down -v --remove-orphans
  publish:
    needs: compose
    if: >-
      github.repository == 'decryptus/certlord' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate stable image version
        id: version
        run: |
          version=$(cat VERSION)
          python -c 'import re; from pathlib import Path; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", Path("VERSION").read_text().strip())'
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: decryptus
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            decryptus/certlord:${{ steps.version.outputs.version }}
            decryptus/certlord:latest
