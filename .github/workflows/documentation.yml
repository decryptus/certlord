name: Documentation captures
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install package and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install . -r scripts/requirements-docs.txt
          python -m pip check
      - name: Capture installed client and check documented output
        run: |
          python scripts/capture_docs.py --installed --output /tmp/certlord-captures
          for file in docs/images/*.txt docs/images/capture.json; do
            diff -u "$file" "/tmp/certlord-captures/$(basename "$file")"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: certlord-documentation-captures
          path: /tmp/certlord-captures
          if-no-files-found: error
