name: Documentation captures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install package and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install . -r scripts/requirements-docs.txt
          python -m pip check
      - name: Capture installed client and check documented output
        run: |
          python scripts/capture_docs.py --installed --output /tmp/certlord-captures
          for file in docs/images/*.txt docs/images/capture.json; do
            diff -u "$file" "/tmp/certlord-captures/$(basename "$file")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: certlord-documentation-captures
          path: /tmp/certlord-captures
          if-no-files-found: error
